; PHP settings for the PHP B-Tree image.
;
; The code uses a few calls that PHP 8.3 marks as deprecated, and it writes
; a notice when it saves a temporary file. Both are harmless, so they are
; hidden to keep the output of bin/console readable.
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE

; Show each error once, in the terminal.
display_errors = stderr
log_errors = Off
